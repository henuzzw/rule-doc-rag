[project]
name = "rule-doc-rag"
version = "0.1.0"
description = "RAG + LLM based rule documentation generator demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "openai>=1.30",
]

[project.optional-dependencies]
bge = [
  "sentence-transformers>=2.7",
]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
